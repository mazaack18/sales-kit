<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account Atlas | 営業先の組織マップ</title><link rel="stylesheet" href="/style.css"></head><body><aside><div class="logo">◈ Account Atlas</div><p>営業先の理解を、ひとつの地図に。</p><label>営業先の会社<select id="company"></select></label><button id="addCompany">＋ 会社を追加</button><div class="aside-note">データはこのブラウザーに保存されます。チーム共有には対応していません。</div><button id="export">データを書き出す</button></aside><main><header><div><div class="eyebrow">ACCOUNT INTELLIGENCE</div><h1 id="title"></h1><p>組織と、その先のつながりを見渡す。</p></div><button class="primary" id="addDept">＋ 部署を追加</button></header><div class="stats" id="stats"></div><div class="toolbar"><h2>組織キャンバス</h2><label class="search">検索 <input id="search" placeholder="部署・担当者・パートナー・SaaS"></label></div><p class="hint">本部の枠の中に部署を追加し、担当者・パートナー・ツールをカードで配置できます。初期データは架空です。</p><div class="canvas-tools"><span class="legend">🟨 担当者　🟦 外部パートナー　🟪 利用SaaS</span><div><button id="zoomOut" aria-label="縮小">−</button> <output id="zoomLabel">100%</output> <button id="zoomIn" aria-label="拡大">＋</button> <button id="zoomReset">等倍に戻す</button></div></div><div class="workspace"><div class="canvas-viewport" tabindex="0" aria-label="組織図。横と縦にスクロールできます"><section id="tree" aria-label="組織図"></section></div><section id="detail" aria-label="部署の詳細"></section></div><p id="notice" role="status"></p></main><dialog id="editor"><form id="form"><h2>部署の情報</h2><input type="hidden" name="id"><label>部署名<input name="name" required maxlength="100"></label><label>上位の部署<select name="parent"></select></label><label>担当者（1行に1人）<textarea name="people" placeholder="山田 太郎 / 部長"></textarea></label><label>外部パートナー（1行に1社）<textarea name="partners" placeholder="A社 / システム導入支援"></textarea></label><label>利用SaaS（1行に1ツール）<textarea name="saas" placeholder="Salesforce / 顧客管理"></textarea></label><label>営業メモ<textarea name="notes" maxlength="5000"></textarea></label><p id="error" role="alert"></p><div class="actions"><button type="button" id="cancel">キャンセル</button><button class="primary">保存する</button></div></form></dialog><script src="/app.js"></script></body></html>
